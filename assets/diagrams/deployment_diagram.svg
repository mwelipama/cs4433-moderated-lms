r are compiled into the executable; the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.7568" x="441.5" y="471.2217">database is a single file to back up.</text></g><!--link APP to DB--><g id="link_APP_DB"><path d="M255.91,313.4695 C251.35,340.8495 245.3461,376.841 240.6061,405.291 " fill="none" id="APP-to-DB" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="239.62,411.2095,245.0447,402.9892,240.4417,406.2774,237.1535,401.6745,239.62,411.2095" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.4976" x="252.5" y="357.0332">in-process reads/writes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.7168" x="265.8904" y="372.7627">(embedded SQLite)</text></g><!--link A to APP--><g id="link_A_APP"><path d="M56.12,120.5295 C59.89,136.2195 66.16,153.8995 76.5,167.4395 C106.8,207.0995 149.3934,234.1664 188.7634,253.6664 " fill="none" id="A-to-APP" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="194.14,256.3295,187.8504,248.7505,189.6595,254.1102,184.2997,255.9193,194.14,256.3295" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.7314" x="77.5" y="164.0332">console session</text></g><!--link L to APP--><g id="link_L_APP"><path d="M184.19,120.5695 C182.98,135.4295 183.2,152.4895 187.5,167.4395 C197.06,200.6995 215.5208,228.9277 232.9308,251.2577 " fill="none" id="L-to-APP" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="236.62,255.9895,234.2407,246.4323,233.5457,252.0463,227.9317,251.3513,236.62,255.9895" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.7314" x="188.5" y="164.0332">console session</text></g><!--link H to APP--><g id